<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engage | Integryl</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css?v=5">
</head>
<body data-page="engage">

<main>
  <section class="section">
    <div class="wrap split">
      <div class="stack" style="--gap:1.6rem">
        <p class="label">Engage</p>
        <h1 style="font-size:clamp(2.4rem,4.6vw,3.9rem)">Begin with a conversation.</h1>
        <p class="lede">Share a brief outline of what you are working through. A senior member of the firm will respond within one business day.</p>
        <dl class="contact" style="margin-top:2.5rem">
          <div><dt>Email</dt><dd><a href="mailto:hello@integryl.com">hello@integryl.com</a></dd></div>
          <div><dt>Office</dt><dd>Hilton Head, South Carolina</dd></div>
        </dl>
      </div>

      <form class="form-card">
        <div class="field"><label for="name">Full name</label><input id="name" type="text" required></div>
        <div class="field"><label for="org">Organization</label><input id="org" type="text" required></div>
        <div class="field"><label for="email">Work email</label><input id="email" type="email" required></div>
        <div class="field">
          <label for="interest">Area of interest</label>
          <select id="interest">
            <option>Select an area</option>
            <option>Fractional Risk &amp; Cybersecurity Leadership</option>
            <option>Artificial Intelligence</option>
            <option>Cybersecurity</option>
            <option>Data Risk</option>
            <option>Technology Risk</option>
            <option>Governance, Risk &amp; Compliance</option>
            <option>Operational Resilience</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field"><label for="msg">How can we help?</label><textarea id="msg"></textarea></div>
        <div class="btn-row"><button class="btn" type="submit">Submit inquiry</button></div>
        <p class="fine" data-form-note>All inquiries are treated as confidential.</p>
      </form>
    </div>
  </section>
</main>

<script src="assets/js/site.js?v=5"></script>
</body>
</html>
